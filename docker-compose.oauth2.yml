version: '3.8'

# ==============================================================================
# Xpra HTML5 Desktop with Injected OAuth2-Proxy (CyberArk Identity / OIDC)
# ==============================================================================
#
# This setup runs the XFCE4 desktop behind an all-in-one injected OAuth2-Proxy.
# Port 14500 is directly protected by oauth2-proxy, which authenticates users
# against your OIDC identity provider (e.g. CyberArk Identity, Keycloak, Okta)
# before allowing WebSockets / HTML5 access to the desktop.
#
# Usage:
#   1. Copy .env.oauth2.example to .env and configure your OIDC credentials
#   2. Run: nerdctl compose -f docker-compose.oauth2.yml up -d
# ==============================================================================

services:
  xpra-desktop:
    build:
      context: .
      dockerfile: Dockerfile
    image: xpra-html5-debian:latest
    container_name: xpra-oauth2
    restart: unless-stopped
    ports:
      - "14500:14500"
    environment:
      # Display configuration
      XPRA_MODE: "desktop"
      XPRA_RESOLUTION: "1920x1080"

      # Activate the embedded oauth2-proxy inside the container
      ENABLE_OAUTH2_PROXY: "true"

      # OIDC / Identity Provider configuration
      OAUTH2_PROXY_PROVIDER: "oidc"
      OAUTH2_PROXY_OIDC_ISSUER_URL: "${OAUTH2_PROXY_OIDC_ISSUER_URL:-https://your-tenant.id.cyberark.cloud/oauth2/app-id}"
      OAUTH2_PROXY_CLIENT_ID: "${OAUTH2_PROXY_CLIENT_ID:-your-client-id}"
      OAUTH2_PROXY_CLIENT_SECRET: "${OAUTH2_PROXY_CLIENT_SECRET:-your-client-secret}"
      
      # 32-byte base64 string (auto-generated by entrypoint if left empty)
      OAUTH2_PROXY_COOKIE_SECRET: "${OAUTH2_PROXY_COOKIE_SECRET:-}"

      # Allowed email domains ("*" allows all authenticated users from the IdP)
      OAUTH2_PROXY_EMAIL_DOMAINS: "${OAUTH2_PROXY_EMAIL_DOMAINS:-*}"

      # Set to "true" when terminating TLS/HTTPS in front of the container
      OAUTH2_PROXY_COOKIE_SECURE: "${OAUTH2_PROXY_COOKIE_SECURE:-false}"

      # Enables WebSockets for Xpra HTML5 (default: true)
      OAUTH2_PROXY_PROXY_WEBSOCKETS: "true"

    shm_size: "256mb"
